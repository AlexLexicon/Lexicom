<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lexicom Packages Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <!--
    =========================================================================
     LEXICOM PACKAGES MONITOR
    =========================================================================
     Edit the CONFIG block in the <script> at the bottom of this file.

       CONFIG.packages = [
         new Collection("collection name", "workflow.yml", 1, 0, [
           new Section("section name", ['Package.One', 'Package.Two']),
           new Section("another section", [ ... ]),
         ]),
         new Collection("untracked collection", null, null, null, [ ... ]),
       ]

     Collection args: name, workflowFile, major, minor, sections.

     The workflowFile is the filename of a GitHub Actions workflow YAML
     under the matching AlexLexicon repo (e.g. 'release.yml'). When set,
     the dashboard polls that workflow's latest run every 60s and shows
     its status (success / failure / running with current step), display
     title, relative time, and run number beneath the collection header.
     Pass null to skip Actions tracking for a collection.

     major and minor are the version prefix the workflow publishes
     packages under. They're combined with the latest successful run's
     GITHUB_RUN_NUMBER to compute the expected version (e.g. major=1
     minor=0 + run #31 ⇒ expected 1.0.31). Packages whose patch is
     behind that number are flagged stale even when they're all on the
     same prior version.

     Collections render side by side (wrapping as space allows). Sections
     inside a collection are collapsible and show their oldest package
     version in the header. Version coloring is per-collection: any version
     that matches the collection's newest is green; older versions are red.

     You can also pass a flat list via URL:
       ?packages=Foo.Bar,Baz.Qux
       ?refresh=10
    =========================================================================
    -->

    <style>
         :root {
             --bg: #0d0f12;
             --bg-elev: #15181d;
             --bg-row: #11141a;
             --border: #242a33;
             --border-strong: #353d49;
             --fg: #e8ecf2;
             --fg-dim: #8a93a3;
             --fg-faint: #5a6271;
             --accent: #7dd3a0;
             --warn: #e8b86a;
             --danger: #e07a78;
             --info: #6fa8dc;
             --shadow: 0 1px 0 rgba(255, 255, 255, 0.02), 0 12px 32px rgba(0, 0, 0, 0.35);
         }

         * {
             box-sizing: border-box;
         }

         html, body {
             margin: 0;
             padding: 0;
             background: var(--bg);
             color: var(--fg);
             font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
             font-size: 14px;
             line-height: 1.5;
             min-height: 100vh;
             -webkit-font-smoothing: antialiased;
         }

         body {
             background-image: radial-gradient(circle at 15% 0%, rgba(125, 211, 160, 0.05) 0%, transparent 40%), radial-gradient(circle at 85% 100%, rgba(111, 168, 220, 0.04) 0%, transparent 40%);
             background-attachment: fixed;
         }

         .container {
             max-width: 1500px;
             margin: 0 auto;
             padding: 24px 32px 0px;
         }

         /* --- Header ----------------------------------------------------------- */
         header {
             display: flex;
             align-items: flex-start;
             justify-content: space-between;
             gap: 32px;
             padding-bottom: 24px;
         }

         .title-block h1 {
             font-family: 'IBM Plex Mono', monospace;
             font-weight: 500;
             font-size: 22px;
             margin: 0 0 6px 0;
             letter-spacing: -0.01em;
         }

             .title-block h1 .status {
                 display: inline-flex;
                 align-items: center;
                 justify-content: center;
                 width: 14px;
                 height: 14px;
                 margin-right: 10px;
                 vertical-align: middle;
             }

                 .title-block h1 .status[data-state="current"] {
                     color: var(--accent);
                 }

                     .title-block h1 .status[data-state="current"]::after {
                         content: '';
                         position: absolute;
                         width: 14px;
                         height: 14px;
                         border-radius: 50%;
                         box-shadow: 0 0 0 0 rgba(125, 211, 160, 0.4);
                         animation: pulse 2s ease-in-out infinite;
                     }

                 .title-block h1 .status[data-state="current"] {
                     position: relative;
                 }

                 .title-block h1 .status svg {
                     display: block;
                     width: 14px;
                     height: 14px;
                     position: relative;
                     z-index: 1;
                 }

             .title-block h1 .status-spinner {
                 display: block;
                 width: 14px;
                 height: 14px;
                 border: 2px solid var(--border);
                 border-top-color: var(--warn);
                 border-radius: 50%;
                 animation: spin 0.9s linear infinite;
                 box-sizing: border-box;
             }

         @keyframes pulse {
             0%, 100% {
                 box-shadow: 0 0 0 0 rgba(125, 211, 160, 0.4);
             }

             50% {
                 box-shadow: 0 0 0 6px rgba(125, 211, 160, 0);
             }
         }

         @keyframes spin {
             to {
                 transform: rotate(360deg);
             }
         }

         .title-block .subtitle {
             color: var(--fg-dim);
             font-size: 13px;
             font-family: 'IBM Plex Mono', monospace;
         }

         .controls {
             display: flex;
             align-items: center;
             gap: 16px;
             font-family: 'IBM Plex Mono', monospace;
             font-size: 12px;
             color: var(--fg-dim);
         }

         .refresh-stack {
             display: flex;
             flex-direction: column;
             gap: 6px;
         }

         .refresh-indicator {
             display: flex;
             align-items: center;
             gap: 8px;
             justify-content: flex-end;
         }

         .refresh-bar {
             width: 60px;
             height: 2px;
             background: var(--border);
             border-radius: 1px;
             overflow: hidden;
         }

         .refresh-bar-fill {
             height: 100%;
             background: var(--accent);
             width: 0%;
             transition: width 1s linear;
         }

         button {
             background: var(--bg-elev);
             color: var(--fg);
             border: 1px solid var(--border-strong);
             padding: 7px 14px;
             font-family: 'IBM Plex Mono', monospace;
             font-size: 12px;
             cursor: pointer;
             border-radius: 4px;
             transition: all 0.15s ease;
         }

             button:hover {
                 background: #1d2129;
                 border-color: var(--fg-dim);
             }

             button:active {
                 transform: translateY(1px);
             }

         /* --- Collections grid -------------------------------------------------- */
         .collections {
             display: grid;
             grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
             gap: 20px;
             align-items: start;
         }

         .collection {
             background: var(--bg-elev);
             border: 1px solid var(--border);
             border-radius: 6px;
             overflow: hidden;
             box-shadow: var(--shadow);
         }

         .collection-name {
             display: flex;
             align-items: center;
             gap: 10px;
             font-family: 'IBM Plex Mono', monospace;
             font-size: 12px;
             font-weight: 500;
             color: var(--fg-dim);
             padding: 14px 18px;
             background: var(--bg-row);
             border-bottom: 1px solid var(--border);
         }

         .collection-status {
             display: inline-flex;
             align-items: center;
             justify-content: center;
             width: 14px;
             height: 14px;
             flex-shrink: 0;
         }

             .collection-status[data-state="current"] {
                 color: var(--accent);
             }

             .collection-status svg {
                 display: block;
                 width: 14px;
                 height: 14px;
             }

             .collection-status[data-state="stale"] svg,
             .collection-status[data-state="loading"] svg {
                 display: none;
             }

             .collection-status[data-state="stale"]::before,
             .collection-status[data-state="loading"]::before {
                 content: '';
                 display: block;
                 width: 14px;
                 height: 14px;
                 border: 2px solid var(--border);
                 border-top-color: var(--warn);
                 border-radius: 50%;
                 box-sizing: border-box;
                 animation: spin 0.9s linear infinite;
             }

         .collection-github,
         .collection-actions {
             display: inline-flex;
             align-items: center;
             justify-content: center;
             width: 14px;
             height: 14px;
             flex-shrink: 0;
             color: var(--fg-faint);
             transition: color 0.15s ease;
         }

             .collection-github:hover,
             .collection-actions:hover {
                 color: var(--fg);
             }

             .collection-github svg,
             .collection-actions svg {
                 display: block;
                 width: 14px;
                 height: 14px;
             }

         /* --- Workflow status bar --------------------------------------------- */
         .workflow-bar {
             display: flex;
             flex-direction: column;
             gap: 6px;
             padding: 9px 18px;
             border-bottom: 1px solid var(--border);
             background: rgba(255, 255, 255, 0.015);
             font-family: 'IBM Plex Sans', sans-serif;
             font-size: 12px;
             min-width: 0;
         }

             .workflow-bar[hidden] {
                 display: none;
             }

         .workflow-row-top,
         .workflow-row-bottom {
             display: flex;
             align-items: center;
             gap: 10px;
             min-width: 0;
         }

         .workflow-row-spacer {
             flex: 1;
             min-width: 8px;
         }

         .workflow-deploy-label {
             flex-shrink: 0;
             color: var(--fg-dim);
             font-family: 'IBM Plex Mono', monospace;
             font-size: 11px;
             text-transform: uppercase;
             letter-spacing: 0.08em;
             white-space: nowrap;
             text-decoration: none;
             transition: color 0.15s ease;
         }

             .workflow-deploy-label:hover {
                 color: var(--fg);
             }

         .workflow-status {
             display: inline-flex;
             align-items: center;
             justify-content: center;
             width: 14px;
             height: 14px;
             flex-shrink: 0;
             color: var(--fg-faint);
         }

             .workflow-status svg {
                 display: block;
                 width: 14px;
                 height: 14px;
             }

             .workflow-status[data-state="success"] {
                 color: var(--accent);
             }

             .workflow-status[data-state="failure"] {
                 color: var(--danger);
             }

             .workflow-status[data-state="cancelled"] {
                 color: var(--fg-faint);
             }

             .workflow-status[data-state="neutral"] {
                 color: var(--fg-faint);
             }

             .workflow-status[data-state="running"] {
                 color: var(--warn);
             }

                 .workflow-status[data-state="running"] svg {
                     display: none;
                 }

                 .workflow-status[data-state="running"]::before {
                     content: '';
                     display: block;
                     width: 14px;
                     height: 14px;
                     border: 2px solid var(--border);
                     border-top-color: var(--warn);
                     border-radius: 50%;
                     box-sizing: border-box;
                     animation: spin 0.9s linear infinite;
                 }

         .workflow-title {
             flex: 1;
             min-width: 0;
             color: var(--fg);
             text-decoration: none;
             overflow: hidden;
             text-overflow: ellipsis;
             white-space: nowrap;
             transition: color 0.15s ease;
         }

             .workflow-title:hover {
                 color: var(--accent);
             }

             .workflow-title.warn {
                 color: var(--warn);
             }


         .workflow-meta {
             color: var(--fg-faint);
             font-family: 'IBM Plex Mono', monospace;
             font-size: 11px;
             flex-shrink: 0;
         }

         /* Step pill — two-tone like the stale pill. Left half is a static
        grey "step" label; right half holds the dynamic status text and
        picks up the state color (yellow running / green completed /
        red failed). */
         .workflow-step {
             display: inline-flex;
             align-items: stretch;
             border: 1px solid var(--border-strong);
             border-radius: 3px;
             overflow: hidden;
             font-family: 'IBM Plex Mono', monospace;
             font-size: 11px;
             flex-shrink: 1;
             min-width: 0;
             max-width: 60%;
             line-height: 1.5;
         }

             .workflow-step[hidden] {
                 display: none;
             }

         .workflow-step-label,
         .workflow-step-status {
             padding: 2px 8px;
             display: inline-flex;
             align-items: center;
         }

         .workflow-step-label {
             background: rgba(138, 147, 163, 0.06);
             color: var(--fg-dim);
             border-right: 1px solid var(--border-strong);
             flex-shrink: 0;
         }

         .workflow-step-status {
             background: rgba(232, 184, 106, 0.08);
             color: var(--warn);
             min-width: 0;
             overflow: hidden;
             text-overflow: ellipsis;
             white-space: nowrap;
         }

         .workflow-step.completed .workflow-step-status {
             background: rgba(125, 211, 160, 0.08);
             color: var(--accent);
         }

         .workflow-step.failed .workflow-step-status {
             background: rgba(224, 122, 120, 0.08);
             color: var(--danger);
         }

         .workflow-step.unknown .workflow-step-status {
             background: rgba(138, 147, 163, 0.06);
             color: var(--fg-dim);
         }

         .workflow-run-id {
             font-family: 'IBM Plex Mono', monospace;
             font-size: 11px;
             font-weight: 500;
             color: var(--fg-faint);
             flex-shrink: 0;
         }

             .workflow-run-id[hidden] {
                 display: none;
             }

         .workflow-expected-version {
             font-family: 'IBM Plex Mono', monospace;
             font-size: 12px;
             font-weight: 500;
             flex-shrink: 0;
         }

         .collection-run-number {
             font-family: 'IBM Plex Mono', monospace;
             font-size: 11px;
             font-weight: 500;
             color: var(--fg-faint);
             flex-shrink: 0;
         }

             .collection-run-number[hidden] {
                 display: none;
             }

         /* Actions icon visual states driven by GitHub workflow run status. */
         .collection-actions[data-state="running"] {
             color: var(--warn);
         }

             .collection-actions[data-state="running"] svg {
                 display: none;
             }

             .collection-actions[data-state="running"]::before {
                 content: '';
                 display: block;
                 width: 14px;
                 height: 14px;
                 border: 2px solid var(--border);
                 border-top-color: var(--warn);
                 border-radius: 50%;
                 box-sizing: border-box;
                 animation: spin 0.9s linear infinite;
             }

         .collection-actions[data-state="failure"] {
             color: var(--danger);
         }

             .collection-actions[data-state="failure"]:hover {
                 color: var(--danger);
             }

         .collection-actions[data-state="ratelimited"] {
             color: var(--fg-faint);
             opacity: 0.4;
         }

         .collection-icon {
             width: 16px;
             height: 16px;
             border-radius: 3px;
             object-fit: contain;
             flex-shrink: 0;
             background: rgba(255, 255, 255, 0.04);
         }

         .collection-title {
             flex: 1;
             text-transform: uppercase;
             letter-spacing: 0.08em;
             overflow: hidden;
             text-overflow: ellipsis;
             white-space: nowrap;
             min-width: 0;
             color: inherit;
             text-decoration: none;
             transition: color 0.15s ease;
         }

             .collection-title:hover {
                 color: var(--fg);
             }

         .collection-spacer {
             flex: 1;
             min-width: 8px;
         }

         /* Two-tone stale pill: green half (up-to-date count) + red half
        (stale count). When everything matches the expected version the
        collection pill goes grey via .equal and the section pills hide. */
         .stale-pill {
             display: inline-flex;
             align-items: stretch;
             border: 1px solid var(--border-strong);
             border-radius: 10px;
             overflow: hidden;
             font-family: 'IBM Plex Mono', monospace;
             font-size: 10px;
             font-weight: 600;
             flex-shrink: 0;
             cursor: help;
             line-height: 1.4;
         }

             .stale-pill[hidden] {
                 display: none;
             }

         .stale-pill-up,
         .stale-pill-down {
             padding: 1px 7px;
             display: inline-flex;
             align-items: center;
             gap: 4px;
         }

         .stale-pill svg {
             display: block;
             width: 8px;
             height: 8px;
         }

         .stale-pill-up {
             background: rgba(125, 211, 160, 0.14);
             color: var(--accent);
             border-right: 1px solid var(--border-strong);
         }

             /* When the "updated" half has zero packages it shouldn't read as
        healthy/green — paint it grey instead. */
             .stale-pill-up.empty {
                 background: rgba(138, 147, 163, 0.06);
                 color: var(--fg-dim);
             }

         .stale-pill-down {
             background: rgba(224, 122, 120, 0.14);
             color: var(--danger);
         }

         /* All-equal collection pill — single grey number, no icon, no split. */
         .stale-pill.equal {
             border-color: var(--border);
         }

         .stale-pill-total {
             padding: 1px 8px;
             background: rgba(138, 147, 163, 0.06);
             color: var(--fg-dim);
         }

         .collection-version {
             font-size: 12px;
             font-weight: 500;
             flex-shrink: 0;
         }

         .collection-expand {
             background: transparent;
             color: var(--fg-faint);
             border: 1px solid var(--border);
             padding: 2px 8px;
             font-family: 'IBM Plex Mono', monospace;
             font-size: 10px;
             font-weight: 500;
             letter-spacing: 0.04em;
             text-transform: lowercase;
             border-radius: 3px;
             cursor: pointer;
             flex-shrink: 0;
             transition: all 0.15s ease;
         }

             .collection-expand:hover {
                 border-color: var(--fg-dim);
                 color: var(--fg-dim);
             }

         /* --- Sections ---------------------------------------------------------- */
         .section {
             border-bottom: 1px solid var(--border);
         }

             .section:last-child {
                 border-bottom: none;
             }

         .section-header {
             display: flex;
             align-items: center;
             gap: 10px;
             padding: 11px 18px;
             cursor: pointer;
             user-select: none;
             transition: background 0.15s ease;
         }

             .section-header:hover {
                 background: rgba(255, 255, 255, 0.025);
             }

         .section-toggle {
             display: inline-block;
             width: 14px;
             flex-shrink: 0;
             color: var(--fg-dim);
             font-size: 14px;
             line-height: 1;
             text-align: center;
             transform-origin: center center;
             transition: transform 0.15s ease;
         }

         .section.expanded .section-toggle {
             transform: rotate(90deg);
         }

         .section-name {
             flex: 1;
             font-family: 'IBM Plex Sans', sans-serif;
             font-size: 13px;
             font-weight: 500;
             color: var(--fg);
             min-width: 0;
             overflow: hidden;
             text-overflow: ellipsis;
             white-space: nowrap;
         }

         .section-version {
             font-family: 'IBM Plex Mono', monospace;
             font-size: 12px;
             font-weight: 500;
             flex-shrink: 0;
         }

         .section-body {
             display: none;
             padding: 2px 18px 12px 38px;
         }

         .section.expanded .section-body {
             display: block;
         }

         .package-row {
             display: flex;
             align-items: center;
             gap: 8px;
             padding: 5px 0;
             font-family: 'IBM Plex Mono', monospace;
             font-size: 12px;
         }

         .package-name {
             flex: 1;
             color: var(--fg-dim);
             min-width: 0;
             overflow: hidden;
             text-overflow: ellipsis;
             white-space: nowrap;
         }

             .package-name a {
                 color: inherit;
                 text-decoration: none;
             }

                 .package-name a:hover {
                     color: var(--fg);
                 }

         .package-github {
             display: inline-flex;
             align-items: center;
             justify-content: center;
             width: 14px;
             height: 14px;
             flex-shrink: 0;
             color: var(--fg-faint);
             transition: color 0.15s ease;
         }

             .package-github:hover {
                 color: var(--fg);
             }

             .package-github svg {
                 display: block;
                 width: 14px;
                 height: 14px;
             }

         .package-version {
             font-weight: 500;
             flex-shrink: 0;
         }

         /* Version color states */
         .version-newest {
             color: var(--accent);
         }

         .version-older {
             color: var(--danger);
         }

         .version-equal {
             color: var(--fg-dim);
         }

         .version-unknown {
             color: var(--fg-faint);
         }

         .version-loading {
             color: var(--fg-faint);
             opacity: 0.7;
         }

         /* --- Config notice ---------------------------------------------------- */
         .notice {
             background: var(--bg-elev);
             border: 1px solid var(--border);
             border-left: 3px solid var(--warn);
             padding: 16px 20px;
             border-radius: 4px;
             margin-bottom: 24px;
             font-family: 'IBM Plex Mono', monospace;
             font-size: 13px;
             color: var(--fg-dim);
         }

             .notice strong {
                 color: var(--fg);
             }

             .notice code {
                 background: var(--bg);
                 padding: 2px 6px;
                 border-radius: 3px;
                 color: var(--accent);
                 font-size: 12px;
             }

         @media (max-width: 720px) {
             .container {
                 padding: 24px 16px 48px;
             }

             header {
                 flex-direction: column;
                 gap: 16px;
             }

             .collections {
                 grid-template-columns: 1fr;
             }
         }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="title-block">
                <h1>lexicom packages monitor</h1>
                <div class="subtitle" id="targetLine">— packages</div>
            </div>
            <div class="controls">
                <div class="refresh-stack">
                    <div class="refresh-indicator">
                        <span id="refreshText">next packages refresh in 15s</span>
                        <div class="refresh-bar"><div class="refresh-bar-fill" id="refreshBar"></div></div>
                    </div>
                    <div class="refresh-indicator">
                        <span id="actionsRefreshText">next github refresh in 180s</span>
                        <div class="refresh-bar"><div class="refresh-bar-fill" id="actionsRefreshBar"></div></div>
                    </div>
                </div>
                <button id="refreshBtn">refresh now</button>
            </div>
        </header>

        <div id="configNotice" class="notice" style="display:none;">
            <strong>No packages configured.</strong> Edit the <code>CONFIG.packages</code> array
            at the bottom of <code>index.html</code>, or append <code>?packages=Your.Package,Another.One</code> to the URL.
        </div>

        <div id="collections" class="collections"></div>
    </div>

    <script>
        // ===================================================================
        // CONFIG — edit me
        // ===================================================================

        class Section {
            constructor(name, packages) {
                this.name = name;
                this.packages = packages;
            }
        }

        class Collection {
            // `workflowFile` is optional — the filename of the GitHub Actions
            // workflow YAML (e.g. 'release.yml' or 'ci.yml') to track for this
            // collection. When set, the latest run for that workflow is shown
            // beneath the collection header. Pass null (or undefined) to skip.
            //
            // `major` and `minor` are the version prefix this collection's
            // workflow publishes packages under. They're combined with the
            // latest successful run's GITHUB_RUN_NUMBER to synthesize the
            // expected version ({major}.{minor}.{run_number}) — packages
            // whose patch is below that show as stale even when they're all
            // on the same prior version. Required only if workflowFile is set.
            constructor(name, workflowFile, major, minor, sections) {
                this.name = name;
                this.workflowFile = workflowFile || null;

        // Compares two SemVer-like version strings. Returns negative if a < b,
        // 0 if equal, positive if a > b. Missing/empty values sort smaller.
        function compareVersions(a, b) {
            if (a === b) return 0;
            if (!a) return -1;
            if (!b) return 1;

            const aDash = a.indexOf('-');
            const bDash = b.indexOf('-');
            const aMain = aDash === -1 ? a : a.slice(0, aDash);
            const bMain = bDash === -1 ? b : b.slice(0, bDash);
            const aPre = aDash === -1 ? '' : a.slice(aDash + 1);
            const bPre = bDash === -1 ? '' : b.slice(bDash + 1);

            const aParts = aMain.split('.');
            const bParts = bMain.split('.');
            const len = Math.max(aParts.length, bParts.length);
            for (let i = 0; i < len; i++) {
                const av = parseInt(aParts[i] || '0', 10) || 0;
                const bv = parseInt(bParts[i] || '0', 10) || 0;
                if (av !== bv) return av - bv;
            }

            // Per SemVer: a version without prerelease > a version with prerelease.
            if (!aPre && !bPre) return 0;
            if (!aPre) return 1;
            if (!bPre) return -1;

            const aPreParts = aPre.split('.');
            const bPreParts = bPre.split('.');
            const preLen = Math.max(aPreParts.length, bPreParts.length);
            for (let i = 0; i < preLen; i++) {
                const ap = aPreParts[i];
                const bp = bPreParts[i];
                if (ap === undefined) return -1;
                if (bp === undefined) return 1;
                const aIsNum = /^[0-9]+$/.test(ap);
                const bIsNum = /^[0-9]+$/.test(bp);
                if (aIsNum && bIsNum) {
                    const an = parseInt(ap, 10);
                    const bn = parseInt(bp, 10);
                    if (an !== bn) return an - bn;
                } else if (aIsNum) {
                    return -1;
                } else if (bIsNum) {
                    return 1;
                } else if (ap !== bp) {
                    return ap < bp ? -1 : 1;
                }
            }
            return 0;
        }

        // Decrement the last non-zero numeric segment of a version, dropping any
        // prerelease tag. "1.2.5" -> "1.2.4", "2.0.0" -> "1.0.0", "1.2.3-beta" -> "1.2.2".
        // Returns the original string if every segment is already 0.
        function downgradeVersion(version) {
            const dashIdx = version.indexOf('-');
            const main = dashIdx === -1 ? version : version.slice(0, dashIdx);
            const parts = main.split('.').map(p => parseInt(p, 10) || 0);
            for (let i = parts.length - 1; i >= 0; i--) {
                if (parts[i] > 0) {
                    parts[i]--;
                    return parts.join('.');
                }
            }
            return version;
        }

        // Test mode: simulate a slow rolling release. First refresh marks
        // every package stale (downgraded). On each subsequent refresh, every
        // still-stale package rolls a 30% chance to "catch up" — once it
        // does, the set remembers it and it stays on its real version for
        // the rest of the session.
        const testUpdatedSet = new Set();
        let testInitialSweepDone = false;

        function applyTestMutations() {
            for (const [pkg, info] of versionStore) {
                if (!info.version) continue;
                if (testUpdatedSet.has(pkg)) continue;

                if (testInitialSweepDone && Math.random() < 0.3) {
                    // Package catches up this refresh — leave the real version in place.
                    testUpdatedSet.add(pkg);
                    continue;
                }

                const downgraded = downgradeVersion(info.version);
                if (downgraded !== info.version) {
                    info.version = downgraded;
                }
            }
            testInitialSweepDone = true;
        }

        async function fetchAllVersions() {
            const pkgs = [];
            for (const collection of CONFIG.packages) {
                for (const section of collection.sections) {
                    for (const pkg of section.packages) {
                        pkgs.push(pkg);
                    }
                }
            }
            await Promise.all(pkgs.map(async pkg => {
                try {
                    const result = await querySearchIndex(pkg);
                    versionStore.set(pkg, {
                        version: result ? result.latest : null,
                        iconUrl: result ? result.iconUrl : null,
                    });
                } catch (e) {
                    versionStore.set(pkg, { version: null, iconUrl: null, error: e.message });
                }
            }));
        }

        function setVersionClass(el, kind) {

            el.classList.add(kind);

        // ---- Run-number helpers -------------------------------------------
        // Extract the trailing numeric segment of a version, ignoring any
        // prerelease tag. "1.0.31" → 31, "1.0.31-beta" → 31.
        function extractPatch(version) {
            if (!version) return null;
            const dashIdx = version.indexOf('-');
            const main = dashIdx === -1 ? version : version.slice(0, dashIdx);
            const parts = main.split('.');
            if (parts.length === 0) return null;
            const n = parseInt(parts[parts.length - 1], 10);
            return isNaN(n) ? null : n;
        }

        // Highest patch across all known packages in a collection — used as
        // a fallback "run number" when GitHub Actions data is unavailable.
        function maxPackagePatch(collection) {
            let max = null;
            for (const section of collection.sections) {
                for (const pkg of section.packages) {
                    const info = versionStore.get(pkg);
                    if (info && info.version) {
                        const patch = extractPatch(info.version);
                        if (patch != null && (max == null || patch > max)) max = patch;
                    }
                }
            }
            return max;
        }

        // Resolve the run number to use for comparison against package versions.
        // Returns { number, source } or null. source ∈ 'actions' | 'lastsuccess' | 'fallback'.
        function getEffectiveRunNumber(collection) {
            const state = actionsStore.get(collection.name);
            if (state && state.runNumber != null) {
                // Use the latest run unless it definitively failed/cancelled.
                const usable = state.status !== 'completed'
                    || state.conclusion === 'success'
                    || state.conclusion == null;
                if (usable) return { number: state.runNumber, source: 'actions' };
            }
            if (state && state.lastSuccessRunNumber != null) {
                return { number: state.lastSuccessRunNumber, source: 'lastsuccess' };
            }
            // Last resort: deduce from the highest published patch we can see.
            const max = maxPackagePatch(collection);
            if (max != null) return { number: max, source: 'fallback' };
            return null;
        }

        // Synthesize the expected version for a collection from major.minor +
        // the effective run number. Returns { version, runNumber, source } or null.
        function getExpectedVersion(collection) {
            if (collection.major == null || collection.minor == null) return null;
            const info = getEffectiveRunNumber(collection);
            if (!info) return null;
            return {
                version: `${collection.major}.${collection.minor}.${info.number}`,
                runNumber: info.number,
                source: info.source,
            };
        }

        const STATUS_SPINNER_HTML = '<span class="status-spinner"></span>';
        const STATUS_CHECK_HTML =
            '<svg viewBox="0 0 16 16" aria-hidden="true">' +

        const WORKFLOW_NEUTRAL_HTML =

        function formatRelativeTime(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            if (isNaN(d.getTime())) return '';
            const diff = (Date.now() - d.getTime()) / 1000;
            if (diff < 60) return `${Math.max(0, Math.floor(diff))}s ago`;
            if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
            if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
            const days = Math.floor(diff / 86400);
            if (days < 30) return `${days}d ago`;
            return d.toISOString().slice(0, 10);
        }

        // Up/down chevrons for the two-tone stale pill.
        const PILL_UP_ICON_HTML =

        function setStatus(el, state) {
            if (!el) return;
            if (el.dataset.state !== state) {
                el.dataset.state = state;
                el.innerHTML = state === 'current' ? STATUS_CHECK_HTML : STATUS_SPINNER_HTML;
                el.title = state === 'current'
                    ? 'all packages up to date'
                    : state === 'stale'
                        ? 'packages out of date'
                        : 'loading…';
            }
        }

        function updateUi() {
            const root = document.getElementById('collections');
            const collectionEls = root.querySelectorAll('.collection');

            for (const collectionEl of collectionEls) {
                const ci = Number(collectionEl.dataset.collectionIndex);
                const collection = CONFIG.packages[ci];

                // Max version across all known packages in this collection.
                let collectionMax = null;
                for (const section of collection.sections) {
                    for (const pkg of section.packages) {
                        const info = versionStore.get(pkg);
                        const v = info && info.version;
                        if (v && (!collectionMax || compareVersions(v, collectionMax) > 0)) {
                            collectionMax = v;
                        }
                    }
                }

                // Fold the expected version ({major}.{minor}.{runNumber}) into
                // the max so packages still on the prior run are flagged stale.
                // Falls back to deducing the run number from the highest patch
                // already published when GitHub Actions data isn't available.
                const expected = getExpectedVersion(collection);
                if (expected
                    && (!collectionMax || compareVersions(expected.version, collectionMax) > 0)) {
                    collectionMax = expected.version;
                }

                // Count up-to-date and stale packages across the whole collection.
                let collectionUp = 0;
                let collectionStale = 0;
                let totalCollectionPackages = 0;
                for (const section of collection.sections) {
                    totalCollectionPackages += section.packages.length;
                    for (const pkg of section.packages) {
                        const info = versionStore.get(pkg);
                        const v = info && info.version;
                        if (v && collectionMax) {
                            if (compareVersions(v, collectionMax) >= 0) collectionUp++;
                            else collectionStale++;
                        }
                    }
                }
                // When every package matches the expected version, paint the
                // up-to-date colors grey (everything is equal) instead of green —
                // green is reserved for "current vs. stale" comparisons.
                const allEqual = collectionMax != null && collectionStale === 0;
                const upToDateState = allEqual ? 'version-equal' : 'version-newest';

                // The workflow bar's expected-version label uses the same color
                // logic so it turns green when something is behind, grey when
                // everything matches.
                const wfExpectedVerEl = collectionEl.querySelector('.workflow-expected-version');
                if (wfExpectedVerEl) {
                    setVersionClass(wfExpectedVerEl, collectionMax != null ? upToDateState : 'version-unknown');
                }

                // Per-collection status indicator on the far left.
                const collStatusEl = collectionEl.querySelector('.collection-status');
                if (collStatusEl) {
                    if (collectionMax == null) {
                        setStatus(collStatusEl, 'loading');
                    } else if (collectionStale > 0) {
                        setStatus(collStatusEl, 'stale');
                    } else {
                        setStatus(collStatusEl, 'current');
                    }
                }

                // Collection-level two-tone pill — always visible.
                //  • Stale state: (chevron-up updated / chevron-down stale).
                //    The up half goes grey instead of green when the count is 0.
                //  • All-equal state: collapses to a single grey number — just the
                //    total package count, no icons, no split.
                const collStaleEl = collectionEl.querySelector('.collection-stale-pill');
                if (collStaleEl) {
                    collStaleEl.hidden = false;
                    if (collectionStale > 0) {
                        collStaleEl.classList.remove('equal');
                        const upClass = collectionUp === 0 ? 'stale-pill-up empty' : 'stale-pill-up';
                        collStaleEl.innerHTML =
                            `<span class="${upClass}">${PILL_UP_ICON_HTML}${collectionUp}</span>` +
                            `<span class="stale-pill-down">${PILL_DOWN_ICON_HTML}${collectionStale}</span>`;
                        collStaleEl.title = `${collectionUp} up to date / ${collectionStale} behind ${collectionMax}`;
                    } else {
                        collStaleEl.classList.add('equal');
                        collStaleEl.innerHTML =
                            `<span class="stale-pill-total">${totalCollectionPackages}</span>`;
                        collStaleEl.title = collectionMax
                            ? `all ${totalCollectionPackages} packages at ${collectionMax}`
                            : `${totalCollectionPackages} packages`;
                    }
                }

                // Pull the icon URL from the first package in the collection.
                const firstSection = collection.sections[0];
                const firstPkgId = firstSection && firstSection.packages[0];
                const firstPkgInfo = firstPkgId ? versionStore.get(firstPkgId) : null;
                const iconUrl = firstPkgInfo && firstPkgInfo.iconUrl;
                const collIconEl = collectionEl.querySelector('.collection-icon');
                if (iconUrl) {
                    if (collIconEl.dataset.url !== iconUrl) {
                        collIconEl.dataset.url = iconUrl;
                        collIconEl.hidden = true;
                        collIconEl.onload = () => { collIconEl.hidden = false; };
                        collIconEl.onerror = () => { collIconEl.hidden = true; };
                        collIconEl.src = iconUrl;
                    }
                } else {
                    collIconEl.hidden = true;
                    collIconEl.removeAttribute('src');
                    delete collIconEl.dataset.url;
                }

                const sectionEls = collectionEl.querySelectorAll('.section');
                for (const sectionEl of sectionEls) {
                    const si = Number(sectionEl.dataset.sectionIndex);
                    const section = collection.sections[si];

                    // Oldest known version in this section + up/down counts within it.
                    let sectionOldest = null;
                    let sectionUp = 0;
                    let sectionStale = 0;
                    for (const pkg of section.packages) {
                        const info = versionStore.get(pkg);
                        const v = info && info.version;
                        if (v) {
                            if (!sectionOldest || compareVersions(v, sectionOldest) < 0) {
                                sectionOldest = v;
                            }
                            if (collectionMax) {
                                if (compareVersions(v, collectionMax) >= 0) sectionUp++;
                                else sectionStale++;
                            }
                        }
                    }

                    const verEl = sectionEl.querySelector('.section-version');
                    if (!sectionOldest) {
                        verEl.textContent = '—';
                        setVersionClass(verEl, 'version-unknown');
                    } else {
                        verEl.textContent = sectionOldest;
                        setVersionClass(
                            verEl,
                            compareVersions(sectionOldest, collectionMax) >= 0 ? upToDateState : 'version-older',
                        );
                    }

                    // Two-tone section pill — hidden when everything in the section
                    // matches; otherwise chevron-up updated / chevron-down stale.
                    // Up half goes grey when the section has zero updated packages.
                    const sectionStaleEl = sectionEl.querySelector('.section-stale-pill');
                    if (sectionStaleEl) {
                        if (sectionStale > 0) {
                            sectionStaleEl.hidden = false;
                            const upClass = sectionUp === 0 ? 'stale-pill-up empty' : 'stale-pill-up';
                            sectionStaleEl.innerHTML =
                                `<span class="${upClass}">${PILL_UP_ICON_HTML}${sectionUp}</span>` +
                                `<span class="stale-pill-down">${PILL_DOWN_ICON_HTML}${sectionStale}</span>`;
                            sectionStaleEl.title = `${sectionUp} up to date / ${sectionStale} behind ${collectionMax}`;
                        } else {
                            sectionStaleEl.hidden = true;
                        }
                    }

                    // Package rows.
                    const rowEls = sectionEl.querySelectorAll('.package-row');
                    for (const rowEl of rowEls) {
                        const pkg = rowEl.dataset.pkg;
                        const info = versionStore.get(pkg);
                        const pverEl = rowEl.querySelector('.package-version');
                        if (!info) {
                            pverEl.textContent = '…';
                            pverEl.title = '';
                            setVersionClass(pverEl, 'version-loading');
                        } else if (info.error) {
                            pverEl.textContent = 'error';
                            pverEl.title = info.error;
                            setVersionClass(pverEl, 'version-unknown');
                        } else if (!info.version) {
                            pverEl.textContent = 'not found';
                            pverEl.title = '';
                            setVersionClass(pverEl, 'version-unknown');
                        } else {
                            pverEl.textContent = info.version;
                            pverEl.title = '';
                            setVersionClass(
                                pverEl,
                                compareVersions(info.version, collectionMax) >= 0 ? upToDateState : 'version-older',
                            );
                        }
                    }
                }
            }

        }

        async function refresh() {
            const total = totalPackages();
            if (total === 0) {
                document.getElementById('configNotice').style.display = 'block';
                document.getElementById('collections').innerHTML = '';
                return;
            }

            document.getElementById('targetLine').textContent =
                `${total} package${total === 1 ? '' : 's'}`;

            await fetchAllVersions();
            if (CONFIG.testMode) {
                applyTestMutations();
            }
            updateUi();
        }

        // Refresh-countdown UI.
        let refreshTimer = null;
        let countdownTimer = null;

        function scheduleNext() {
            if (refreshTimer) clearTimeout(refreshTimer);
            if (countdownTimer) clearInterval(countdownTimer);

            const totalMs = CONFIG.refreshIntervalMs;
            const start = Date.now();
            const bar = document.getElementById('refreshBar');
            const text = document.getElementById('refreshText');

            // Snap the bar to 0 instantly (no transition), then resume animating.
            bar.style.transition = 'none';
            bar.style.width = '0%';
            void bar.offsetWidth; // force reflow so the snap commits before the transition is restored
            bar.style.transition = '';
            text.textContent = `next packages refresh in ${Math.ceil(totalMs / 1000)}s`;

            countdownTimer = setInterval(() => {
                const elapsed = Date.now() - start;
                const pct = Math.min(100, (elapsed / totalMs) * 100);
                bar.style.width = pct + '%';
                const remaining = Math.max(0, Math.ceil((totalMs - elapsed) / 1000));
                text.textContent = `next packages refresh in ${remaining}s`;
            }, 250);

            refreshTimer = setTimeout(async () => {
                await refresh();
                scheduleNext();
            }, totalMs);
        }

        document.getElementById('refreshBtn').addEventListener('click', async () => {
            // Reset the progress bar and timer first so the user sees immediate feedback,
            // then re-fetch versions and Actions status in parallel with the new
            // countdown. pollActionsStatuses self-skips if currently rate-limited,
            // and ETag caching makes the GitHub round-trips cheap. We also
            // re-schedule the next actions poll afterward so its interval reflects
            // any new in_progress state from this fetch.
            scheduleNext();
            await Promise.all([refresh(), pollActionsStatuses()]);
            scheduleNextActionsPoll();
        });

        // Update one collection's expand button label to reflect the action
        // its next click will perform.
        function updateCollectionExpandButton(collectionEl) {
            const btn = collectionEl.querySelector('.collection-expand');
            if (!btn) return;
            const sections = collectionEl.querySelectorAll('.section');
            if (sections.length === 0) {
                btn.textContent = 'expand';
                return;
            }
            let allExpanded = true;
            for (const sectionEl of sections) {
                if (!sectionEl.classList.contains('expanded')) {
                    allExpanded = false;
                    break;
                }
            }
            btn.textContent = allExpanded ? 'collapse' : 'expand';
        }

        // -------------------------------------------------------------------
        // GitHub Actions status polling
        // -------------------------------------------------------------------
        // collectionName -> {
        //   status:        queued | in_progress | completed | none | error | ratelimited
        //   conclusion:    success | failure | cancelled | skipped | ... | null
        //   currentStep:   name of the in-progress step, when status=in_progress
        //   runId:         numeric workflow-run id
        //   runUrl:        html_url for the run
        //   runName:       run.name (e.g. workflow display name)
        //   displayTitle:  run.display_title (often the commit message)
        //   runStartedAt:  ISO timestamp the run began
        //   etag/jobsEtag: cached ETags for conditional requests
        // }
        const actionsStore = new Map();
        let actionsPollTimer = null;
        let actionsRateLimitedUntil = 0;

        // Persist actionsStore + rate-limit backoff to localStorage so page
        // refreshes reuse cached ETags (304 = free) instead of burning fresh
        // requests against the 60/hour unauth limit.
        const ACTIONS_STORE_KEY = 'lexicom.actionsStore.v1';
        const ACTIONS_RL_KEY = 'lexicom.actionsRateLimitedUntil.v1';

        function loadActionsCache() {
            try {
                const raw = localStorage.getItem(ACTIONS_STORE_KEY);
                if (raw) {
                    const obj = JSON.parse(raw);
                    for (const [k, v] of Object.entries(obj)) actionsStore.set(k, v);
                }
                const rl = localStorage.getItem(ACTIONS_RL_KEY);
                if (rl) {
                    const n = parseInt(rl, 10);
                    if (!isNaN(n) && n > Date.now()) actionsRateLimitedUntil = n;
                }
            } catch (e) { /* ignore */ }
        }

        function saveActionsCache() {
            try {
                const obj = {};
                for (const [k, v] of actionsStore) obj[k] = v;
                localStorage.setItem(ACTIONS_STORE_KEY, JSON.stringify(obj));
                localStorage.setItem(ACTIONS_RL_KEY, String(actionsRateLimitedUntil));
            } catch (e) { /* ignore */ }
        }

        function githubHeaders(etag) {
            const headers = { 'Accept': 'application/vnd.github+json' };
            if (etag) headers['If-None-Match'] = etag;
            return headers;
        }

        function logRateLimit(label, res) {
            const remaining = res.headers.get('X-RateLimit-Remaining');
            const limit = res.headers.get('X-RateLimit-Limit');
            const reset = res.headers.get('X-RateLimit-Reset');
            const etag = res.headers.get('ETag');
            const resetIn = reset ? Math.max(0, Math.round(parseInt(reset, 10) - Date.now() / 1000)) : '?';
            console.log(
                `[actions] ${label} → HTTP ${res.status}, ` +
                `rate ${remaining ?? '?'}/${limit ?? '?'} ` +
                `(resets in ${resetIn}s), ETag ${etag ? 'present' : 'MISSING'}`,
            );
        }

        async function fetchLatestRun(collection) {
            if (!collection.workflowFile) return;
            const stored = actionsStore.get(collection.name) || {};
            // per_page=10 so we have enough runs in one request to find both the
            // very latest (for the status bar) and the latest *successful* run
            // (for the run-number comparison against package versions).
            const url = `https://api.github.com/repos/AlexLexicon/${encodeURIComponent(collection.name)}` +
                `/actions/workflows/${encodeURIComponent(collection.workflowFile)}/runs?per_page=10`;
            let res;
            try {
                res = await fetch(url, { headers: githubHeaders(stored.etag) });
            } catch (e) {
                console.log(`[actions] ${collection.name}/runs → network error: ${e.message}`);
                actionsStore.set(collection.name, { ...stored, status: 'error', errorDetail: `network: ${e.message}` });
                return;
            }

            logRateLimit(`${collection.name}/runs`, res);

            // 304 = unchanged. Keep prior state; if it was in-progress, still poll
            // jobs so the current step can advance even when the run list itself
            // looks identical.
            if (res.status === 304) {
                if (stored.status === 'in_progress' || stored.status === 'queued') {
                    await fetchRunJobs(collection.name, stored.runId);
                }
                return;
            }

            if (res.status === 403 || res.status === 429) {
                actionsRateLimitedUntil = Date.now() + 60 * 60 * 1000;
                actionsStore.set(collection.name, { ...stored, status: 'ratelimited' });
                return;
            }

            if (!res.ok) {
                const detail = res.status === 404
                    ? `404 — repo AlexLexicon/${collection.name} or workflow ${collection.workflowFile} not found`
                    : `HTTP ${res.status}`;
                actionsStore.set(collection.name, { ...stored, status: 'error', errorDetail: detail });
                return;
            }

            const etag = res.headers.get('ETag');
            const data = await res.json();
            const allRuns = (data.workflow_runs || []);
            const run = allRuns[0];
            if (!run) {
                actionsStore.set(collection.name, { etag, status: 'none' });
                return;
            }

            // Latest successful run number — used to synthesize the expected
            // package version. If the latest run is currently in_progress, the
            // most-recently-published packages still reflect the prior success.
            const lastSuccess = allRuns.find(r => r.status === 'completed' && r.conclusion === 'success');
            const lastSuccessRunNumber = lastSuccess ? lastSuccess.run_number : null;

            const newState = {
                etag,
                status: run.status,
                conclusion: run.conclusion,
                runId: run.id,
                runUrl: run.html_url,
                runName: run.name,
                runNumber: run.run_number,
                lastSuccessRunNumber,
                displayTitle: run.display_title
                    || (run.head_commit && run.head_commit.message
                        ? run.head_commit.message.split('\n')[0]
                        : null)
                    || run.name
                    || 'Workflow run',
                runStartedAt: run.run_started_at || run.created_at,
                jobsEtag: stored.jobsEtag,
                currentStep: null,
            };

            if (run.status === 'in_progress' || run.status === 'queued') {
                await fetchRunJobs(collection.name, run.id, newState);
            }

            actionsStore.set(collection.name, newState);
        }

        async function fetchRunJobs(collectionName, runId, state) {
            const stored = state || actionsStore.get(collectionName) || {};
            const url = `https://api.github.com/repos/AlexLexicon/${encodeURIComponent(collectionName)}` +
                `/actions/runs/${runId}/jobs`;
            let res;
            try {
                res = await fetch(url, { headers: githubHeaders(stored.jobsEtag) });
            } catch (e) {
                console.log(`[actions] ${collectionName}/jobs → network error: ${e.message}`);
                return;
            }

            logRateLimit(`${collectionName}/jobs`, res);

            if (res.status === 304) return;
            if (!res.ok) return;

            const jobsEtag = res.headers.get('ETag');
            const data = await res.json();

            // First in-progress step we find across all running jobs.
            let currentStep = null;
            for (const job of data.jobs || []) {
                if (job.status === 'in_progress' || job.status === 'queued') {
                    for (const step of job.steps || []) {
                        if (step.status === 'in_progress') {
                            currentStep = step.name;
                            break;
                        }
                    }
                    if (currentStep) break;
                }
            }

            if (state) {
                state.jobsEtag = jobsEtag;
                state.currentStep = currentStep;
            } else {
                const existing = actionsStore.get(collectionName) || {};
                actionsStore.set(collectionName, {
                    ...existing,
                    jobsEtag,
                    currentStep,
                });
            }
        }

        function applyActionsStatusToUi() {
            const collectionEls = document.querySelectorAll('.collection');
            for (const collectionEl of collectionEls) {
                const ci = Number(collectionEl.dataset.collectionIndex);
                const collection = CONFIG.packages[ci];
                const barEl = collectionEl.querySelector('.workflow-bar');
                if (!barEl) continue;

                // Untracked collections never show the bar at all.
                if (!collection.workflowFile) {
                    barEl.hidden = true;
                    continue;
                }

                const state = actionsStore.get(collection.name);
                const actionsHomeUrl = `https://github.com/AlexLexicon/${encodeURIComponent(collection.name)}/actions`;
                const runIdEl = barEl.querySelector('.workflow-run-id');
                const expVerEl = barEl.querySelector('.workflow-expected-version');

                // Populate the split run-id (bottom row, right) and expected-version
                // (top row, right). `numberForVersion` is the run number whose
                // expected version we should show; pass null to fall back to the
                // deduced number from package patches. A `#?` runIdText hides the
                // id span entirely (we only show the # when the real run number
                // is known).
                function populateRunNumber(runIdText, numberForVersion, tooltip) {
                    const showRunId = !!runIdText && runIdText !== '#?';
                    let expectedNumber = numberForVersion;
                    if (expectedNumber == null) {
                        const eff = getEffectiveRunNumber(collection);
                        if (eff) expectedNumber = eff.number;
                    }
                    const expectedText =
                        (expectedNumber != null && collection.major != null && collection.minor != null)
                            ? `${collection.major}.${collection.minor}.${expectedNumber}`
                            : '';

                    runIdEl.hidden = !showRunId;
                    runIdEl.textContent = showRunId ? runIdText : '';
                    runIdEl.title = tooltip || '';
                    expVerEl.textContent = expectedText;
                    expVerEl.title = expectedText
                        ? `the latest packages version is ${expectedText}`
                        : '';
                }

                // Helper to render a non-success state in the bar (loading, error,
                // none, ratelimited) so the user always sees what's going on.
                function renderBarMessage(iconState, label, tooltip) {
                    barEl.hidden = false;
                    const statusLink = barEl.querySelector('.workflow-status');
                    const titleLink = barEl.querySelector('.workflow-title');
                    const stepEl = barEl.querySelector('.workflow-step');
                    const metaEl = barEl.querySelector('.workflow-meta');
                    statusLink.dataset.state = iconState;
                    statusLink.href = actionsHomeUrl;
                    statusLink.title = tooltip || label;
                    statusLink.innerHTML = iconState === 'running' ? '' : WORKFLOW_NEUTRAL_HTML;
                    titleLink.href = actionsHomeUrl;
                    titleLink.textContent = label;
                    titleLink.title = tooltip || label;
                    metaEl.textContent = '';
                    metaEl.title = '';
                    stepEl.hidden = true;
                    stepEl.classList.remove('completed', 'failed', 'unknown');
                    const stepStatusEl = stepEl.querySelector('.workflow-step-status');
                    if (stepStatusEl) stepStatusEl.textContent = '';
                    stepEl.title = '';
                    titleLink.classList.remove('warn');
                    const eff = getEffectiveRunNumber(collection);
                    populateRunNumber('#?', null, eff
                        ? `run number unknown — comparing against #${eff.number} (deduced from published versions)`
                        : 'run number unknown');
                }

                if (!state) {
                    renderBarMessage('running', `loading ${collection.workflowFile}…`,
                        `Polling AlexLexicon/${collection.name} for ${collection.workflowFile}`);
                    continue;
                }
                if (state.status === 'error') {
                    renderBarMessage('failure', state.errorDetail || 'could not load workflow runs',
                        state.errorDetail || 'fetch error');
                    continue;
                }
                if (state.status === 'none') {
                    renderBarMessage('neutral', `no runs for ${collection.workflowFile} yet`,
                        `${collection.workflowFile} exists but has no runs`);
                    continue;
                }
                if (state.status === 'ratelimited') {
                    // Show a blank top-row title (no rate-limited banner text) and
                    // surface the state in the step pill instead: "rate limited" in
                    // yellow.
                    renderBarMessage('neutral', '',
                        'unauthenticated rate limit is 60 requests/hour — polling will retry in an hour');
                    const stepEl = barEl.querySelector('.workflow-step');
                    const stepStatusEl = stepEl.querySelector('.workflow-step-status');
                    stepEl.classList.remove('completed', 'failed', 'unknown');
                    stepEl.hidden = false;
                    stepStatusEl.textContent = 'rate limited';
                    stepEl.title = 'GitHub API rate-limited — workflow status unavailable';
                    continue;
                }

                // Resolve a single visual state for the bar.
                let iconState;
                if (state.status === 'in_progress' || state.status === 'queued') {
                    iconState = 'running';
                } else if (state.status === 'completed') {
                    if (state.conclusion === 'success') iconState = 'success';
                    else if (state.conclusion === 'failure') iconState = 'failure';
                    else if (state.conclusion === 'cancelled') iconState = 'cancelled';
                    else iconState = 'neutral';
                } else {
                    iconState = 'neutral';
                }

                barEl.hidden = false;
                const statusLink = barEl.querySelector('.workflow-status');
                const titleLink = barEl.querySelector('.workflow-title');
                const stepEl = barEl.querySelector('.workflow-step');
                const metaEl = barEl.querySelector('.workflow-meta');

                statusLink.dataset.state = iconState;
                statusLink.href = state.runUrl || '#';
                statusLink.title =
                    iconState === 'success' ? 'last run succeeded' :
                        iconState === 'failure' ? 'last run failed' :
                            iconState === 'running' ? (state.status === 'queued' ? 'queued' : 'running') :
                                iconState === 'cancelled' ? 'last run cancelled' : 'last run';
                if (iconState === 'success') statusLink.innerHTML = WORKFLOW_SUCCESS_HTML;
                else if (iconState === 'failure') statusLink.innerHTML = WORKFLOW_FAILURE_HTML;
                else if (iconState === 'running') statusLink.innerHTML = ''; // spinner via ::before
                else statusLink.innerHTML = WORKFLOW_NEUTRAL_HTML;

                const title = state.displayTitle || state.runName || 'Workflow run';
                titleLink.textContent = title;
                titleLink.title = title;
                titleLink.href = state.runUrl || '#';

                metaEl.textContent = formatRelativeTime(state.runStartedAt);
                metaEl.title = state.runStartedAt
                    ? new Date(state.runStartedAt).toLocaleString()
                    : '';

                // Display rules:
                //   success / running / queued → show the actual run number, paired
                //     with the expected version M.m.runNumber
                //   failure / cancelled / neutral → #? + the deduced expected version
                const runIsUsable = iconState === 'success' || iconState === 'running';
                if (runIsUsable && state.runNumber != null) {
                    const tooltipNote = (collection.major != null
                        && collection.minor != null
                        && state.lastSuccessRunNumber != null
                        && state.lastSuccessRunNumber !== state.runNumber)
                        ? ` — last successful #${state.lastSuccessRunNumber} (${collection.major}.${collection.minor}.${state.lastSuccessRunNumber})`
                        : '';
                    populateRunNumber(`#${state.runNumber}`, state.runNumber,
                        `run #${state.runNumber}${tooltipNote}`);
                } else {
                    const eff = getEffectiveRunNumber(collection);
                    const failedRunNote = state.runNumber != null
                        ? `latest run #${state.runNumber} ${iconState}`
                        : iconState;
                    const tooltip = eff
                        ? `${failedRunNote} — comparing against #${eff.number} (${eff.source === 'fallback' ? 'deduced from published versions' : eff.source === 'lastsuccess' ? 'last successful run' : 'actions'})`
                        : failedRunNote;
                    populateRunNumber('#?', null, tooltip);
                }

                titleLink.classList.remove('warn');
                const stepStatusEl = stepEl.querySelector('.workflow-step-status');
                stepEl.classList.remove('completed', 'failed', 'unknown');
                if (iconState === 'running' && state.currentStep) {
                    stepEl.hidden = false;
                    stepStatusEl.textContent = state.currentStep;
                    stepEl.title = `current step: ${state.currentStep}`;
                } else if (iconState === 'success') {
                    stepEl.hidden = false;
                    stepEl.classList.add('completed');
                    stepStatusEl.textContent = 'completed';
                    stepEl.title = 'workflow run completed';
                } else if (iconState === 'failure') {
                    stepEl.hidden = false;
                    stepEl.classList.add('failed');
                    stepStatusEl.textContent = 'failed';
                    stepEl.title = 'workflow run failed';
                } else {
                    stepEl.hidden = true;
                    stepStatusEl.textContent = '';
                    stepEl.title = '';
                }
            }

            // The expected version (major.minor.lastSuccessRunNumber) feeds into
            // the per-collection max calculation in updateUi, so refresh the
            // package coloring whenever actions data updates.
            updateUi();
        }

        async function pollActionsStatuses() {
            if (Date.now() < actionsRateLimitedUntil) {
                const minsLeft = Math.ceil((actionsRateLimitedUntil - Date.now()) / 60000);
                console.log(`[actions] skipping poll — rate-limited for ~${minsLeft} more min`);
                applyActionsStatusToUi();
                return;
            }
            const trackable = CONFIG.packages.filter(c => c.workflowFile);
            if (trackable.length === 0) return;
            await Promise.all(trackable.map(c => fetchLatestRun(c)));
            applyActionsStatusToUi();
            saveActionsCache();
        }

        // True if any tracked workflow currently has a run in_progress / queued.
        function anyActionInProgress() {
            for (const c of CONFIG.packages) {
                if (!c.workflowFile) continue;
                const s = actionsStore.get(c.name);
                if (s && (s.status === 'in_progress' || s.status === 'queued')) return true;
            }
            return false;
        }

        // setTimeout-based scheduler so each poll can pick the next interval
        // based on the live state: faster when something is running, slower
        // when everything is idle. Also drives the dedicated countdown bar in
        // the header.
        let actionsCountdownTimer = null;

        function scheduleNextActionsPoll() {
            if (actionsPollTimer) clearTimeout(actionsPollTimer);
            if (actionsCountdownTimer) clearInterval(actionsCountdownTimer);
            const next = anyActionInProgress()
                ? CONFIG.actionsPollInProgressIntervalMs
                : CONFIG.actionsPollIntervalMs;
            const start = Date.now();

            const bar = document.getElementById('actionsRefreshBar');
            const text = document.getElementById('actionsRefreshText');
            if (bar) {
                bar.style.transition = 'none';
                bar.style.width = '0%';
                void bar.offsetWidth;
                bar.style.transition = '';
            }
            if (text) text.textContent = `next github refresh in ${Math.ceil(next / 1000)}s`;

            actionsCountdownTimer = setInterval(() => {
                const elapsed = Date.now() - start;
                const pct = Math.min(100, (elapsed / next) * 100);
                if (bar) bar.style.width = pct + '%';
                const remaining = Math.max(0, Math.ceil((next - elapsed) / 1000));
                if (text) text.textContent = `next github refresh in ${remaining}s`;
            }, 250);

            actionsPollTimer = setTimeout(async () => {
                await pollActionsStatuses();
                scheduleNextActionsPoll();
            }, next);
        }

        function startActionsPolling() {
            if (actionsPollTimer) clearTimeout(actionsPollTimer);
            loadActionsCache();
            // Render whatever we already cached so the bar isn't blank during the
            // first network round-trip.
            applyActionsStatusToUi();
            pollActionsStatuses().then(scheduleNextActionsPoll);
        }

        // Boot.
        buildSkeleton();
        refresh().then(scheduleNext);
        startActionsPolling();
    </script>
</body>
</html>
