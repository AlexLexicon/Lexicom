name: Deploy Pages

on:
  workflow_dispatch:  
  push:
    branches: [ master ]
    paths:
      - '.github/pages/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: .github/pages

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5